name: Bump version on push

# Every push to master bumps the patch (1.0.0 → 1.0.1 → …).
# Skips its own bump commits to avoid a loop.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: bump-version-master
  cancel-in-progress: false

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch
        id: bump
        run: |
          NEXT="$(node scripts/bump-version.mjs patch | tail -n 1)"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            apps/orchestrator/package.json \
            apps/orchestrator/package-lock.json \
            apps/orchestrator/src-tauri/tauri.conf.json \
            apps/orchestrator/src-tauri/Cargo.toml \
            apps/orchestrator/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No version files changed"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push
